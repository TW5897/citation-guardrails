name: live selftest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: catches API changes before users do

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python skills/check-references/scripts/citecheck.py selftest --no-cache
        env:
          CITECHECK_EMAIL: ${{ secrets.CITECHECK_EMAIL }}
